name: branch minmax tests
on:
  push:
    branches:
      - feat-grupos-min-max-produtos-flexiveis-20260907
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: node --check js/order-utils.js
      - run: node --check js/app.js
      - run: node --check admin/admin.js
