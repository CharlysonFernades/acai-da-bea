name: apply product visibility branch
on:
  push:
    branches:
      - feat-produto-visivel-cardapio-20260907
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message != 'Implementa visibilidade de produtos no cardapio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-produto-visivel-cardapio-20260907
      - name: Aplicar alteracoes
        run: python scripts/apply_product_visibility_branch.py
      - name: Verificar sintaxe e testes
        run: |
          node --check js/order-utils.js
          node --check js/app.js
          node --check admin/admin.js
          npm test
      - name: Commitar alteracoes da branch
        run: |
          git config user.name "Charlyson Fernandes"
          git config user.email "pontescharlyson@gmail.com"
          git add js/order-utils.js js/app.js admin/admin.js firebase/firestore.rules tests/product-visibility.test.js
          git commit -m "Implementa visibilidade de produtos no cardapio"
          git push origin HEAD:feat-produto-visivel-cardapio-20260907
